name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: 2. Java 17 및 Node.js 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Android SDK 및 Gradle 8.7 설정
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Cordova 앱 생성 및 app.zip 적용
        run: |
          npm install -g cordova
          cordova create bulletApp com.taeeun.bulletjournal "마이불렛저널"
          rm -rf bulletApp/www/*
          unzip -o app.zip -d bulletApp/www/
          cd bulletApp
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: 5. 완성된 APK 파일 추출
        uses: actions/upload-artifact@v4
        with:
          name: BulletJournal-APK
          path: bulletApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
