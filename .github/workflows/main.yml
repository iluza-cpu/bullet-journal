name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.zip'
      - '**.html'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: 2. Java 17 및 Node.js 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Gradle 8.7 설정
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 4. Cordova 앱 생성, 알림 플러그인 설치 및 APK 빌드
        run: |
          npm install -g cordova
          cordova create bulletApp com.taeeun.bulletjournal "마이불렛저널"
          rm -rf bulletApp/www/*
          
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o -j *.zip -d bulletApp/www/
          elif ls *.html 1> /dev/null 2>&1; then
            cp *.html bulletApp/www/
          else
            echo "오류: 업로드된 zip 또는 html 파일이 없습니다!"
            exit 1
          fi
          
          cd bulletApp/www
          if [ ! -f index.html ]; then
            HTML_FILE=$(ls *.html | head -n 1)
            mv "$HTML_FILE" index.html
          fi
          cd ..
          
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-local-notification
          cordova build android --debug

      - name: 5. 완성된 APK 파일 추출
        uses: actions/upload-artifact@v4
        with:
          name: BulletJournal-APK
          path: bulletApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
